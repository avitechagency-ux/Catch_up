name: Build Signed Release APK

# Triggers on push to main, version tags ("v*"), or manual trigger via workflow_dispatch
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Opt in to Node 24 for JavaScript-based GitHub Actions to prevent Node 20 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build & Sign Release APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Set up Gradle caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Prepare & verify the Release Keystore (alias: "upload") expected by app/build.gradle.kts
      - name: Prepare Release Keystore (my-upload-key.jks)
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || 'CatchUpRel2026!Key' }}
        run: |
          DEFAULT_KEYSTORE_B64=""
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          elif [ -f "${{ github.workspace }}/release.keystore.base64" ]; then
            tr -d '\r\n ' < "${{ github.workspace }}/release.keystore.base64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          else
            echo "$DEFAULT_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          fi
          cp "${{ github.workspace }}/my-upload-key.jks" "${{ github.workspace }}/app/my-upload-key.jks"
          keytool -list -v -keystore "${{ github.workspace }}/my-upload-key.jks" -alias upload -storepass "$STORE_PASSWORD"

      # Step 5: Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 6: Configure .env for the Secrets Gradle Plugin
      - name: Configure environment (.env)
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          URL_VAL="${SUPABASE_URL_SECRET:-https://xzutgxiwexxhmpqtybaf.supabase.co}"
          KEY_VAL="${SUPABASE_ANON_KEY_SECRET:-your-anon-key}"
          GOOGLE_CLIENT_VAL="${GOOGLE_WEB_CLIENT_ID_SECRET:-your-google-web-client-id.apps.googleusercontent.com}"
          printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nGOOGLE_WEB_CLIENT_ID=%s\n" "$URL_VAL" "$KEY_VAL" "$GOOGLE_CLIENT_VAL" > .env

      # Step 7: Build signed Release APK and Release AAB using app/build.gradle.kts signingConfig
      - name: Build signed Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || 'CatchUpRel2026!Key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || 'CatchUpRel2026!Key' }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # Step 8: Verify signed Release APK output
      - name: Verify Signed Release APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed Release APK successfully created at app/build/outputs/apk/release/app-release.apk"
            ls -lh app/build/outputs/apk/release/app-release.apk
          else
            echo "Error: app/build/outputs/apk/release/app-release.apk not found!"
            exit 1
          fi

      # Step 9a: Upload signed Release APK artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catchup-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Step 9b: Upload signed Release AAB artifact
      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catchup-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Step 10: Clean up temporary keystore copy in app/
      - name: Clean up temporary keystore copy
        if: always()
        run: rm -f app/my-upload-key.jks

