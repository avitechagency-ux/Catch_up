name: Build Debug APK

# Triggers the workflow on every push to the main branch or manual trigger via workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest
    # Prevent jobs from hanging indefinitely if Gradle or network dependencies stall
    timeout-minutes: 25

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17 required by AGP and Kotlin toolchain)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Configure Gradle build environment and optimize repeat build caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Ensure Gradle wrapper script has execute permissions
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 5: Restore debug keystore from base64 if debug.keystore is git-ignored
      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      # Step 6: Build the Android Debug APK using Gradle with stacktrace logging for clear diagnostics
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # Step 7: Verify that the output APK was generated at the expected path
      - name: Verify APK output
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK successfully created at app/build/outputs/apk/debug/app-debug.apk"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Error: app/build/outputs/apk/debug/app-debug.apk not found!"
            exit 1
          fi

      # Step 8: Upload the compiled debug APK as a downloadable GitHub Actions artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catchup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
